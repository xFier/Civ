# The name this server is registered under in the proxy. It is also the identity this server owns
# player data under, so it has to match the proxy's server list exactly - a name the proxy does not
# know owns nothing, and a name belonging to another server owns that server's players.
server-name: main

# Shown to a player whose data could not be claimed or restored. They are refused rather than let in
# on whatever this server happens to have on disk, because that would be someone else's stale copy.
failure-message: "Unable to load your player data. Please reconnect and try again."

# How often a player who is still playing is written back, in seconds. Their data is otherwise only
# stored when they leave or cross a border, so a server that is killed rather than stopped cleanly
# loses everything since they arrived. Set to 0 to turn it off.
save-interval-seconds: 60

# Shown to a player who crosses in from another shard. Their client has to leave play, rebuild its
# registries and load terrain again - the same sequence as logging in, and it looks like it - so this
# is what marks the moment as having walked somewhere rather than having been disconnected. It cannot
# shorten the pause, which is Minecraft's own and about 370ms of it is unavoidable. MiniMessage
# formatting. Leave both blank to show nothing.
arrival:
  title: ""
  subtitle: ""

# This server holds no database credentials. It reaches its player data by asking the proxy over
# RabbitMQ, and the proxy is the only thing that reads or writes the store.
rabbitmq:
  user: guest
  password: guest
  host: localhost
  port: 5672
